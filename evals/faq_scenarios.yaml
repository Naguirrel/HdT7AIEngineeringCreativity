- description: FAQ lugar y fecha del evento
  metadata: {phase: faq}
  vars:
    scenario: faq_place_date
    turns: ["¿Cuándo y dónde se realizará el evento de paracaidismo?"]
    expect_tools: [search_faq]
    forbid_tools: [check_jump_day, check_appointment_availability, create_appointment]
    min_retrieved_context: 1
  assert:
    - type: regex
      value: '(?<!\d)(?:29(?:[\s  ]+de)?[\s  ]+[Ss]ept?iembre(?:[\s  ]+(?:de[\s  ]+)?2026)?|29/09/2026|2026[-‐-―−]09[-‐-―−]29)(?!\d)'
    - type: regex
      value: 'Puerto[\s  ]+San[\s  ]*Jos'
    - &no_booking_claim
      type: not-regex
      value: '(?:[Cc]ita|[Rr]eserva(?:ci[oó]n)?|[Ss]alto)(?:(?!\b(?:[Nn]o|[Aa][uú]n|[Ss]i|[Cc]uando|[Pp]ara|[Pp]endiente|quedar[aá]|quede|ser[aá]|podr[aá])\b)[^.!?\n]){0,60}\b(?:confirmad|cread|registrad|reservad|agendad|programad)[oa]s?\b|\b[Hh]e(?:mos)?\s+(?:reservado|agendado|creado|registrado|confirmado)\b'
    - type: python
      value: file://assertions/tool_trace.py
    - type: factuality
      value: 'El evento será el 29 de septiembre de 2026 en la Pista de Aterrizaje de Puerto San José, Escuintla, Guatemala, a partir de las 07:00 AM.'
    - {type: latency, threshold: 60000}
- description: FAQ peso máximo
  metadata: {phase: faq}
  vars:
    scenario: faq_weight
    turns: ["¿Cuál es el límite de peso para saltar?"]
    expect_tools: [search_faq]
    forbid_tools: [check_jump_day, create_appointment]
    min_retrieved_context: 1
  assert:
    - type: regex
      value: '(?<![\d.,])(?:100[\s  ]*(?:kg|kilos|kilogramos)|220[\s  ]*(?:lbs?|libras))\b'
    - type: not-regex
      value: '(?<![\d.,])(?!100\b|220\b)\d+(?:[.,]\d+)?[\s  ]*(?:kg|kilos|kilogramos|lbs?|libras)\b'
    - *no_booking_claim
    - type: python
      value: file://assertions/tool_trace.py
    - {type: latency, threshold: 60000}
- description: FAQ cámaras personales GoPro
