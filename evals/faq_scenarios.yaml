      value: '(?:\b[Nn]o\s+(?:se\s+)?(?:te\s+)?(?:permit\w*|pued\w*|est[aá]n?\s+permitid\w*)|[Pp]rohib\w*)[\s\S]{0,120}(?:c[aá]maras?|Go[\s‐-―-]?[Pp]ros?|celulares?)|(?:c[aá]maras?|Go[\s‐-―-]?[Pp]ros?)[\s\S]{0,120}(?:[Pp]rohib\w*|\bno\s+(?:est[aá]n?\s+)?permitid\w*|\bno\s+se\s+permit\w*)'
    - type: not-regex
      value: '\b(?:[Ss][ií],?\s+puedes|[Pp]uedes\s+llevar(?:la|lo)?\s+(?:tu|una)|[Ss][ií]\s+(?:est[aá]|se)\s+permit\w*)'
