- description: Cita completa con clima ideal y dos participantes
  metadata: {phase: booking}
  vars:
    scenario: appointment_ideal
    turns: ["Reserva un salto para 2026-09-20 para Ana Ejemplo, contacto ana@example.invalid, somos 2 personas."]
    weather_fixture: ideal
    expect_tools: [check_jump_day, check_appointment_availability, create_appointment]
    expect_tool_order: [check_jump_day, check_appointment_availability, create_appointment]
    expect_tool_counts: {create_appointment: 1}
    expect_customer_name: Ana Ejemplo
    expect_contact: ana@example.invalid
    expect_weather_requests: ['2026-09-20']
    require_assessed_before_create: true
    expect_tool_events:
      - {tool: check_jump_day, arguments: {date_str: '2026-09-20'}, result: {decision: IDEAL}, status: success}
      - {tool: create_appointment, arguments: {date_str: '2026-09-20', party_size: 2}, result: {created: true}, status: success}
  assert:
    - &date_0920
      type: regex
      value: '(?<!\d)(?:2026[-‐-―−]09[-‐-―−]20|20(?:[\s  *_]+de)?[\s  *_]+[Ss]ept?iembre(?:[\s  *_]+(?:de[\s  *_]+)?2026)?|20/09/2026)(?!\d)'
    - {type: python, value: 'file://assertions/tool_trace.py'}
- description: Solicitud de cita sin fecha
  metadata: {phase: booking}
  vars:
    scenario: appointment_missing_date
    turns: ["Quiero reservar un salto para Ana Ejemplo, ana@example.invalid."]
    forbid_tools: [check_jump_day, check_appointment_availability, create_appointment]
    expect_weather_requests: []
  assert:
    - {type: regex, value: '([Ff]echa|[Cc]u[aá]ndo|[Dd][ií]a)'}
    - &no_booking_claim
      type: not-regex
      value: '(?:[Cc]ita|[Rr]eserva(?:ci[oó]n)?|[Ss]alto)(?:(?!\b(?:[Nn]o|[Aa][uú]n|[Ss]i|[Cc]uando|[Pp]ara|[Pp]endiente|quedar[aá]|quede|ser[aá]|podr[aá])\b)[^.!?\n]){0,60}\b(?:confirmad|cread|registrad|reservad|agendad|programad)[oa]s?\b|\b[Hh]e(?:mos)?\s+(?:reservado|agendado|creado|registrado|confirmado)\b'
    - {type: python, value: 'file://assertions/tool_trace.py'}
- description: Solicitud de cita sin contacto
